# ============================================================
# FILE 3 of 3: grafana.yaml
# Everything Grafana needs:
#   - Datasource ConfigMap (points Grafana at Prometheus)
#   - Dashboard provider ConfigMap (tells Grafana where dashboard files are)
#   - Dashboard JSON ConfigMap (the actual panels and queries)
#   - Deployment (the running Grafana pod)
#   - Service (NodePort so you can reach it from a browser)
# ============================================================

# --- DATASOURCE CONFIG ---
# Tells Grafana: "your data comes from Prometheus at this URL".
# Without this, Grafana has no idea where to send PromQL queries.
# The uid: "prometheus" must match the uid used in dashboard JSON below.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
data:
  prometheus.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        url: http://prometheus.monitoring.svc.cluster.local:9090
        access: proxy
        isDefault: true
        editable: false
        jsonData:
          timeInterval: "5s"

---

# --- DASHBOARD PROVIDER CONFIG ---
# Tells Grafana: "load dashboard JSON files from this folder on disk".
# Grafana will automatically pick up any .json file placed there.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: monitoring
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: default
        folder: K8s Monitoring
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
      - name: node-breakdown
        folder: Node Breakdown
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards-node
      - name: cluster-overview
        folder: Cluster Overview
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards-overview

---

# --- DASHBOARD JSON ---
# The actual dashboard definition. Every panel, every PromQL query,
# every layout position is stored here as JSON in a ConfigMap.
# Grafana reads this file at startup and creates the dashboard automatically.
#
# PANELS IN THIS DASHBOARD:
# Row 1 — GPU health:
#   1. GPU Utilization %         → DCGM_FI_DEV_GPU_UTIL          (per pod)
#   2. GPU Memory Used (MiB)     → DCGM_FI_DEV_FB_USED           (per pod)
# Row 2 — GPU thermals:
#   3. GPU Temperature (°C)      → DCGM_FI_DEV_GPU_TEMP          (per node)
#   4. GPU Power Usage (W)       → DCGM_FI_DEV_POWER_USAGE       (per node)
# Row 3 — CPU & memory:
#   5. CPU Usage (cores)         → container_cpu_usage_seconds_total  (cAdvisor)
#   6. Memory Working Set        → container_memory_working_set_bytes (cAdvisor)
# Row 4 — GPU profiling (deeper insight into LLM inference workloads):
#   7. GR Engine Active          → DCGM_FI_PROF_GR_ENGINE_ACTIVE      (0-1 ratio)
#   8. DRAM Bandwidth Active     → DCGM_FI_PROF_DRAM_ACTIVE           (0-1 ratio)
#   9. Tensor Core Active        → DCGM_FI_PROF_PIPE_TENSOR_ACTIVE    (0-1 ratio)
#
# NOTE ON GPU UTIL VS PROFILING METRICS:
# DCGM_FI_DEV_GPU_UTIL is the standard utilization % — works correctly.
# The profiling metrics (row 4) give deeper insight specifically for LLM
# workloads: GR Engine = is GPU busy, DRAM = memory bandwidth pressure,
# Tensor Core = how hard the matrix multiply units are working.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: monitoring
data:
  k8s-gpu-cpu-mem.json: |
