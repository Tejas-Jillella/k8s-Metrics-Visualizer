                ]
              }
            },
            "overrides": []
          },
          "options": {
            "orientation": "horizontal",
            "displayMode": "gradient",
            "showUnfilled": true,
            "minVizWidth": 8,
            "minVizHeight": 10,
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}
          }
        },
        {
          "id": 6,
          "title": "GPU Power Usage (W) — Total per Node",
          "type": "bargauge",
          "gridPos": {"h": 9, "w": 12, "x": 12, "y": 18},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "refId": "A",
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "sum by (node) (DCGM_FI_DEV_POWER_USAGE)",
              "legendFormat": "{{node}}",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "watt",
              "min": 0,
              "color": {"mode": "continuous-GrYlRd"}
            },
            "overrides": []
          },
          "options": {
            "orientation": "horizontal",
            "displayMode": "gradient",
            "showUnfilled": true,
            "minVizWidth": 8,
            "minVizHeight": 10,
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}
          }
        }
      ],
      "refresh": "10s",
      "schemaVersion": 39,
      "tags": ["overview", "demo", "cluster", "kubernetes"],
      "time": {"from": "now-30m", "to": "now"},
      "timepicker": {},
      "timezone": "browser",
      "title": "K8s — Cluster Overview",
      "uid": "k8s-cluster-overview",
      "version": 1
    }

