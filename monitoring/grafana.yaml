# --- GRAFANA DEPLOYMENT ---
# The actual Grafana pod. Mounts three ConfigMaps as directories:
# - datasources      → /etc/grafana/provisioning/datasources
# - dashboard-provider → /etc/grafana/provisioning/dashboards
# - dashboards       → /var/lib/grafana/dashboards
# Grafana reads all three at startup and self-configures.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      securityContext:
        runAsUser:    472     # grafana UID
        runAsNonRoot: true
        fsGroup:      472
      containers:
        - name: grafana
          image: grafana/grafana:10.4.2
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: "admin"
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "changeme"          # ← change before deploying
            - name: GF_PATHS_PROVISIONING
              value: /etc/grafana/provisioning
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
            - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
              value: /var/lib/grafana/dashboards/k8s-gpu-cpu-mem.json
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
            - name: dashboards-node
              mountPath: /var/lib/grafana/dashboards-node
            - name: dashboards-overview
              mountPath: /var/lib/grafana/dashboards-overview
            - name: grafana-data
              mountPath: /var/lib/grafana
          resources:
            requests:
              cpu:    100m
              memory: 128Mi
            limits:
              cpu:    500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            timeoutSeconds: 5
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: dashboards
          configMap:
            name: grafana-dashboards
        - name: dashboards-node
          configMap:
            name: grafana-dashboards-node
        - name: dashboards-overview
          configMap:
            name: grafana-dashboards-overview
        - name: grafana-data
          emptyDir: {}
          # For persistence across restarts swap emptyDir for a PVC:
          # persistentVolumeClaim:
          #   claimName: grafana-data

---

# --- GRAFANA SERVICE ---
# NodePort exposes Grafana outside the cluster.
# Reach it at http://<any-node-ip>:30030
# Access from laptop via SSH tunnel:
#   ssh -L 3000:192.168.50.1:30030 sys-teja-admin@131.151.54.141
# Then open http://localhost:3000
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app: grafana
spec:
  selector:
    app: grafana
  type: NodePort
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30030      # reach it at http://<any-node-ip>:30030
