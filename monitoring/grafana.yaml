                "colorMode": "background",
                "graphMode": "area"
              }
            },
            {
              "id": 105,
              "title": "GPU Usage % — by GPU index",
              "type": "timeseries",
              "gridPos": {"h": 6, "w": 18, "x": 6, "y": 7},
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "targets": [
                {
                  "refId": "A",
                  "datasource": {"type": "prometheus", "uid": "prometheus"},
                  "expr": "DCGM_FI_DEV_GPU_UTIL{node=\"$node\"}",
                  "legendFormat": "GPU{{gpu}}"
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "unit": "percent",
                  "min": 0,
                  "max": 100,
                  "color": {"mode": "palette-classic"},
                  "custom": {
                    "drawStyle": "line",
                    "lineWidth": 1,
                    "fillOpacity": 10,
                    "showPoints": "never",
                    "spanNulls": true
                  }
                },
                "overrides": []
              },
              "options": {
                "tooltip": {"mode": "multi", "sort": "desc"},
                "legend": {"displayMode": "table", "placement": "bottom", "calcs": ["mean", "max"]}
              }
            },
            {
              "id": 106,
              "title": "GPU Memory Used (MiB)",
              "type": "timeseries",
              "gridPos": {"h": 8, "w": 12, "x": 0, "y": 13},
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "targets": [
                {
                  "refId": "A",
                  "datasource": {"type": "prometheus", "uid": "prometheus"},
                  "expr": "DCGM_FI_DEV_FB_USED{node=\"$node\"}",
