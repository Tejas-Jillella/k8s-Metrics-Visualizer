            "overrides": []
          },
          "options": {
            "orientation": "horizontal",
            "displayMode": "gradient",
            "showUnfilled": true,
            "minVizWidth": 8,
            "minVizHeight": 10,
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}
          }
        },
        {
          "id": 5,
          "title": "GPU Temperature (°C) — Max per Node",
          "type": "bargauge",
          "gridPos": {"h": 9, "w": 12, "x": 0, "y": 18},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "refId": "A",
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "max by (node) (DCGM_FI_DEV_GPU_TEMP)",
              "legendFormat": "{{node}}",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
